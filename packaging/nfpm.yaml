# nfpm configuration for the Linux .deb and .rpm packages.
# The release workflow extracts each linux archive and runs nfpm from inside the
# extracted directory (so the relative `src` paths below resolve), once per
# architecture, with NFPM_VERSION and NFPM_ARCH set. nfpm expands those env vars
# in the scalar fields but not in a `contents.src` glob, which is why the
# sources are relative rather than absolute. nfpm is pure Go, so it produces
# both formats on the macOS release runner without any native dpkg/rpm tooling.
name: taiga-cli
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
maintainer: "KoukeNeko <111033412+KoukeNeko@users.noreply.github.com>"
description: |
  Independent command-line client for Taiga.
  Drives Taiga 6 projects, agile boards and wikis from the terminal, with a
  versioned --json contract for scripts, CI jobs and agents. Tokens are kept in
  the OS credential store rather than a configuration file.
  Taiga is a trademark of its respective owners. This is an independent client,
  not affiliated with or endorsed by the Taiga project.
homepage: https://github.com/KoukeNeko/taiga-cli
license: MIT
section: utils
priority: optional
contents:
  - src: taiga
    dst: /usr/bin/taiga
  - src: LICENSE
    dst: /usr/share/licenses/taiga-cli/LICENSE
  - src: completions/taiga.bash
    dst: /usr/share/bash-completion/completions/taiga
  - src: completions/_taiga
    dst: /usr/share/zsh/site-functions/_taiga
  - src: completions/taiga.fish
    dst: /usr/share/fish/vendor_completions.d/taiga.fish
