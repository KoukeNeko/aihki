name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    # macOS hosts the release because codesign and notarytool exist nowhere
    # else. Go cross-compiles every other target from here with CGO disabled.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Require a GitHub-verified annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')"
          test "${tag_object%% *}" = tag
          tag_sha="${tag_object#* }"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
          commit_sha="$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit_sha" --jq '.commit.verification.verified')" = true
      - name: Verify source
        run: |
          test -f LICENSE || (echo "LICENSE is required before the first public release" >&2; exit 1)
          # Fail before building rather than after signing, notarizing and
          # uploading, which is where a missing section would otherwise surface.
          # Composing the notes checks both changelogs at once.
          ./scripts/render-release-notes.sh "$GITHUB_REF_NAME" > /dev/null
          make test
      - name: Import the Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # Refuse to fall through to an unsigned macOS build: a release that
          # silently loses its signature is worse than one that fails loudly.
          test -n "$CERT_P12_BASE64" || (echo "MACOS_CERT_P12_BASE64 is required" >&2; exit 1)
          test -n "$CERT_PASSWORD" || (echo "MACOS_CERT_PASSWORD is required" >&2; exit 1)
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -x
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          # Select by certificate hash so a keychain holding more than one
          # Developer ID certificate can never make codesign ambiguous.
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity" || (echo "no Developer ID Application identity in the imported certificate" >&2; exit 1)
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Stage the App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          test -n "$ASC_KEY_P8_BASE64" || (echo "ASC_KEY_P8_BASE64 is required" >&2; exit 1)
          notary_key="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$notary_key"
          chmod 600 "$notary_key"
          echo "NOTARY_KEY=$notary_key" >> "$GITHUB_ENV"
      - name: Package release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          make release \
            VERSION="$GITHUB_REF_NAME" \
            COMMIT="$(git rev-parse HEAD)" \
            SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            SIGN_IDENTITY="$SIGN_IDENTITY" \
            SIGN_KEYCHAIN="$SIGN_KEYCHAIN" \
            NOTARY_KEY="$NOTARY_KEY" \
            NOTARY_KEY_ID="$ASC_KEY_ID" \
            NOTARY_ISSUER="$ASC_ISSUER_ID"
      - name: Verify release assets
        run: |
          cd "dist/$GITHUB_REF_NAME"
          shasum -a 256 --check SHA256SUMS
          linux_dir="taiga_${GITHUB_REF_NAME#v}_linux_amd64"
          darwin_dir="taiga_${GITHUB_REF_NAME#v}_darwin_arm64"
          tar -xzf "$linux_dir.tar.gz"
          tar -xzf "$darwin_dir.tar.gz"
          # This runner is macOS, so only the darwin binary can be executed.
          # The Linux archive is checked structurally instead.
          file "./$linux_dir/taiga" | grep -q "ELF 64-bit"
          "./$darwin_dir/taiga" version --json | grep "\"version\":\"$GITHUB_REF_NAME\""
          # Prove the shipped macOS binary really carries a notarized
          # Developer ID signature rather than an ad-hoc or missing one.
          codesign --verify --strict --verbose=2 "./$darwin_dir/taiga"
          codesign -dvv "./$darwin_dir/taiga" 2>&1 | grep "^Authority=Developer ID Application"
          # spctl resolves the notarization ticket online, so absorb the brief
          # propagation lag rather than burning a tag that cannot be reused.
          for attempt in 1 2 3 4 5; do
            if spctl -a -vvv -t install "./$darwin_dir/taiga"; then
              break
            fi
            test "$attempt" -lt 5 || (echo "notarization ticket never became visible to Gatekeeper" >&2; exit 1)
            sleep 30
          done
          rm -rf "$linux_dir" "$darwin_dir"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A SemVer pre-release tag such as v0.1.0-rc.1 must never be promoted
          # to Latest, which is what gh does without an explicit --prerelease.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          ./scripts/render-release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "dist/$GITHUB_REF_NAME"/* \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --title "$GITHUB_REF_NAME" \
            $prerelease
      - name: Update the Homebrew tap
        # Only stable releases reach the tap: `brew install taiga` must never
        # resolve to a release candidate.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$TAP_TOKEN" || (echo "HOMEBREW_TAP_TOKEN is required to update the tap" >&2; exit 1)
          formula="$RUNNER_TEMP/taiga.rb"
          ./scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" "dist/$GITHUB_REF_NAME/SHA256SUMS" > "$formula"
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/KoukeNeko/homebrew-tap.git" "$tap" 2>/dev/null
          mkdir -p "$tap/Formula"
          cp "$formula" "$tap/Formula/taiga.rb"
          cd "$tap"
          git add Formula/taiga.rb
          if git diff --cached --quiet; then
            echo "The tap already carries this formula."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "taiga $GITHUB_REF_NAME"
          git push
          echo "Updated koukeneko/tap to $GITHUB_REF_NAME."
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/certificate.p12"
          rm -rf "$RUNNER_TEMP/homebrew-tap"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
