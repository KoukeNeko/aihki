name: Package repo

# Rebuilds the signed APT and DNF repositories from every stable release's
# .deb/.rpm and publishes them to GitHub Pages, so `apt`/`dnf` can install and
# auto-upgrade taiga-cli. Runs after a successful Release, and on demand.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-repo
  cancel-in-progress: false

jobs:
  build:
    # Skip failed releases and pre-releases; a manual run always proceeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c gnupg rpm
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || (echo "APT_GPG_PRIVATE_KEY secret is required" >&2; exit 1)
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          test -n "$key_id" || (echo "no signing key found after import" >&2; exit 1)
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"
      - name: Collect every stable release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pool
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease==false) | .tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*.deb' --pattern '*.rpm' --dir pool --skip-existing || true
          done
          echo "Collected $(ls pool | wc -l) package files:"
          ls -1 pool
      - name: Build the repositories
        run: |
          POOL="$PWD/pool" OUT="$PWD/site" GPG_KEY_ID="$GPG_KEY_ID" ./scripts/build-package-repo.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build and check the product website
        working-directory: website
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Assemble product page and package repositories
        run: node website/scripts/assemble-pages.mjs website/dist site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deploy
        uses: actions/deploy-pages@v4
