name: Install scripts

# The installers are verified against the published release rather than the
# working tree, so an unrelated code change cannot affect them. Running them on
# every push only burned CI minutes and inflated the release download counter,
# which is a headline number on the README. Run them when they change, on a
# weekly schedule that catches GitHub or release-hosting behaviour drifting
# underneath them, and on demand.
on:
  push:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/install-scripts.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/install-scripts.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint the POSIX scripts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s sh scripts/install.sh scripts/uninstall.sh scripts/render-homebrew-formula.sh scripts/extract-changelog.sh
      - name: Install and uninstall with the POSIX scripts
        if: runner.os != 'Windows'
        run: |
          # Guarantee at least one completion directory exists so the
          # installer's conditional path runs on every runner, then read the
          # paths back from its own output rather than assuming which candidate
          # it picked.
          mkdir -p "$HOME/.local/share/bash-completion/completions"
          TAIGA_INSTALL_DIR="$RUNNER_TEMP/bin" sh scripts/install.sh | tee "$RUNNER_TEMP/install.log"
          "$RUNNER_TEMP/bin/taiga" version --json | grep '"version"'
          sed -n 's/^Installed .* completion to //p' "$RUNNER_TEMP/install.log" > "$RUNNER_TEMP/completions.txt"
          test -s "$RUNNER_TEMP/completions.txt"
          while read -r file; do test -s "$file"; done < "$RUNNER_TEMP/completions.txt"
          # The uninstaller has to remove exactly what the installer wrote, so
          # the pair is exercised as a round trip rather than separately.
          TAIGA_INSTALL_DIR="$RUNNER_TEMP/bin" sh scripts/uninstall.sh
          test ! -e "$RUNNER_TEMP/bin/taiga"
          while read -r file; do test ! -e "$file"; done < "$RUNNER_TEMP/completions.txt"
      - name: Install and uninstall with the PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -InstallDir "$env:RUNNER_TEMP\bin"
          & "$env:RUNNER_TEMP\bin\taiga.exe" version --json
          ./scripts/uninstall.ps1 -InstallDir "$env:RUNNER_TEMP\bin"
          if (Test-Path "$env:RUNNER_TEMP\bin\taiga.exe") { throw 'the uninstaller left the binary behind' }
