name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go test -race ./...
      - run: go vet ./...

  coverage:
    runs-on: ubuntu-latest
    env:
      # Read at the job level so the step below can test it: a step's own env
      # is not available to its own if condition, which would leave the upload
      # silently skipped on every run.
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -func=coverage.out | tail -1
      # A fork's pull request cannot read the token, and reporting nothing is
      # better than failing a build over it.
      - name: Report coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          coverage-reports: coverage.out
          # Named explicitly because the reporter guesses from the extension
          # and reads a Go profile with the LCOV parser, which finds nothing
          # in it and reports success having sent no data.
          force-coverage-parser: go

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: make test-integration

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: go build ./cmd/taiga

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build release archives
        run: make release VERSION=v0.0.0-ci COMMIT="$GITHUB_SHA" SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
      - name: Verify checksums and metadata
        run: |
          cd dist/v0.0.0-ci
          sha256sum --check SHA256SUMS
          tar -xzf taiga_0.0.0-ci_linux_amd64.tar.gz
          ./taiga_0.0.0-ci_linux_amd64/taiga version --json | grep '"version":"v0.0.0-ci"'
          grep '"spdxVersion": "SPDX-2.3"' taiga_0.0.0-ci_sbom.spdx.json
      - name: Verify reproducible Linux archive
        run: |
          go run ./cmd/releasepack \
            --version v0.0.0-ci \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$(git show -s --format=%ct HEAD)" \
            --output /tmp/taiga-repro \
            --targets linux/amd64
          cmp dist/v0.0.0-ci/taiga_0.0.0-ci_linux_amd64.tar.gz /tmp/taiga-repro/taiga_0.0.0-ci_linux_amd64.tar.gz
          cmp dist/v0.0.0-ci/taiga_0.0.0-ci_sbom.spdx.json /tmp/taiga-repro/taiga_0.0.0-ci_sbom.spdx.json
